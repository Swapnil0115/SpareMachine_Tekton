apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: push-to-github
  namespace: tekton-pipelines
spec:
  tasks:
    - name: set-status-start
      taskRef:
        name: github-set-status
      params:
        - name: REPO_FULL_NAME
          value: https://github.com/Swapnil0115/SpareMachine_Tekton.git
        - name: SHA
          value: "$(params.sha)"
        - name: DESCRIPTION
          value: "Build has started"
        - name: STATE
          value: pending
        - name: TARGET_URL
          value: https://62f2-2401-4900-1cb9-2330-68b3-f9a9-c812-42f8.ngrok-free.app

    - name: clone-repo
      taskRef:
        name: git-clone
        kind: Task
      params:
        - name: url
          value: https://github.com/Swapnil0115/SpareMachine_Tekton.git
        - name: revision
          value: main
      runAfter:
        - set-status-start
      workspaces:
        - name: tekton-learning-workspace

    - name: run-tests
      taskRef:
        name: run-tests
        kind: Task
      runAfter:
        - clone-repo
      workspaces:
        - name: tekton-learning-workspace

    - name: push-to-github
      taskRef:
        name: git-push
        kind: Task
      runAfter:
        - run-tests
      params:
        - name: repo-url
          value: https://github.com/Swapnil0115/SpareMachine_Tekton.git
        - name: branch
          value: main
      workspaces:
        - name: tekton-learning-workspace
  
  finally:
    - name: set-status-success
      when:
        - input: $(tasks.build.status)
          operator: in
          values: ["Succeeded"]
      taskRef:
        name: github-set-status
      params:
        - name: REPO_FULL_NAME
          value: https://github.com/Swapnil0115/SpareMachine_Tekton.git
        - name: SHA
          value: "$(params.sha)"
        - name: DESCRIPTION
          value: "Build has succeeded"
        - name: STATE
          value: success
        - name: TARGET_URL
          value: https://62f2-2401-4900-1cb9-2330-68b3-f9a9-c812-42f8.ngrok-free.app
    - name: set-status-failure
      when:
        - input: $(tasks.build.status)
          operator: in
          values: ["Failed"]
      taskRef:
        name: github-set-status
      params:
        - name: REPO_FULL_NAME
          value: https://github.com/Swapnil0115/SpareMachine_Tekton.git
        - name: SHA
          value: "$(params.sha)"
        - name: DESCRIPTION
          value: "Build has failed"
        - name: STATE
          value: failure
        - name: TARGET_URL
          value: https://62f2-2401-4900-1cb9-2330-68b3-f9a9-c812-42f8.ngrok-free.app

  workspaces:
    - name: tekton-learning-workspace
