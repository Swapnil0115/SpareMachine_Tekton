apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: github-set-status
  labels:
    app.kubernetes.io/version: "custom"
  annotations:
    tekton.dev/categories: Git
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: github
    tekton.dev/displayName: "set github status"
spec:
  description: |
    This task sets the status of a GitHub commit (e.g., for a PR) using the GitHub Status API.
    It is useful for marking CI/CD status on PRs and commits.
  params:
    - name: GITHUB_HOST_URL
      description: |
        The GitHub host, adjust this if you run a GitHub enterprise.
      type: string
      default: api.github.com
    - name: API_PATH_PREFIX
      description: The API path prefix (GitHub Enterprise may require /api/v3)
      type: string
      default: ""
    - name: REPO_FULL_NAME
      description: The GitHub repository full name, e.g. user/repo
      type: string
    - name: GITHUB_TOKEN_SECRET_NAME
      description: The name of the Kubernetes secret containing the GitHub token
      type: string
      default: github-secret
    - name: GITHUB_TOKEN_SECRET_KEY
      description: The key in the secret containing the GitHub token
      type: string
      default: token
    - name: SHA
      description: Commit SHA to set the status for
      type: string
    - name: TARGET_URL
      description: The target URL to associate with this status (e.g., your CI run)
      type: string
    - name: DESCRIPTION
      description: A short description of the status
      type: string
    - name: CONTEXT
      description: A string label to differentiate this status from others (e.g., "continuous-integration/tekton")
      type: string
      default: continuous-integration/tekton
    - name: STATE
      description: |
        The state of the status. Can be one of the following `error`,
        `failure`, `pending`, or `success`.
      type: string
    - name: AUTH_TYPE
      description: |
        The type of authentication to use
      type: string
      default: Bearer
  steps:
    - name: set-status
      image: python:3.11-alpine
      script: |
        #!/usr/bin/env python3
        import json
        import sys
        import http.client
        import os

        token_path = "/etc/github-set-status/" + os.environ.get("GITHUB_TOKEN_SECRET_KEY", "password")
        with open(token_path, "r") as f:
            github_token = f.read().strip()

        status_url = os.environ.get("API_PATH_PREFIX", "") + "/repos/" + os.environ["REPO_FULL_NAME"] + "/statuses/" + os.environ["SHA"]
        data = {
            "state": os.environ["STATE"],
            "target_url": os.environ["TARGET_URL"],
            "description": os.environ["DESCRIPTION"],
            "context": os.environ.get("CONTEXT", "continuous-integration/tekton")
        }
        print("Sending this data to GitHub:")
        print(data)

        authHeader = os.environ.get("AUTH_TYPE", "Bearer") + " " + github_token

        conn = http.client.HTTPSConnection(os.environ.get("GITHUB_HOST_URL", "api.github.com"))
        conn.request(
            "POST",
            status_url,
            body=json.dumps(data),
            headers={
                "User-Agent": "TektonCD",
                "Authorization": authHeader,
                "Accept": "application/vnd.github.v3+json",
            })
        resp = conn.getresponse()
        if not str(resp.status).startswith("2"):
            print("Error: %d" % (resp.status))
            print(resp.read())
            sys.exit(1)
        else:
            print(f"GitHub status '{os.environ['STATE']}' has been set on {os.environ['REPO_FULL_NAME']}#{os.environ['SHA']}")

      env:
        - name: GITHUB_HOST_URL
          value: $(params.GITHUB_HOST_URL)
        - name: API_PATH_PREFIX
          value: $(params.API_PATH_PREFIX)
        - name: REPO_FULL_NAME
          value: $(params.REPO_FULL_NAME)
        - name: SHA
          value: $(params.SHA)
        - name: TARGET_URL
          value: $(params.TARGET_URL)
        - name: DESCRIPTION
          value: $(params.DESCRIPTION)
        - name: CONTEXT
          value: $(params.CONTEXT)
        - name: STATE
          value: $(params.STATE)
        - name: AUTH_TYPE
          value: $(params.AUTH_TYPE)
        - name: GITHUB_TOKEN_SECRET_KEY
          value: password
      volumeMounts:
        - name: githubtoken
          mountPath: /etc/github-set-status
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
  volumes:
    - name: githubtoken
      secret:
        secretName: $(params.GITHUB_TOKEN_SECRET_NAME)
